<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Unseated Juror — Coming Soon</title>
    <meta
      name="description"
      content="A fresh perspective on high-profile cases, legal controversies, and the questions that often go unanswered."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://www.theunseatedjuror.com/" />
    <meta property="og:title" content="The Unseated Juror" />
    <meta property="og:description" content="Real cases. Sharper questions. A deeper look. Coming soon." />
    <meta property="og:image" content="https://www.theunseatedjuror.com/hero.jpg" />
    <meta property="og:type" content="website" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
      }
      body {
        overflow: hidden;
      }
      .stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        width: 100dvw;
        height: 100dvh;
        background: #0a0a0a;
      }
      .stage img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <img
        src="hero.jpg"
        width="1024"
        height="682"
        alt="The Unseated Juror — Real cases. Sharper questions. A deeper look. Coming soon."
        decoding="async"
        fetchpriority="high"
      />
    </main>
  </body>
</html>
