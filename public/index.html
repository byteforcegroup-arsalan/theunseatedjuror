<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Unseated Juror — Coming Soon</title>
    <meta
      name="description"
      content="A fresh perspective on high-profile cases, legal controversies, and the questions that often go unanswered."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://theunseatedjuror.com/" />
    <meta property="og:title" content="The Unseated Juror" />
    <meta property="og:description" content="Real cases. Sharper questions. A deeper look. Coming soon." />
    <meta property="og:image" content="https://theunseatedjuror.com/hero.jpg" />
    <meta property="og:type" content="website" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
      }
      /* Full viewport frame; safe-area for notched phones */
      .frame {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        background: #0a0a0a;
      }
      /*
        Scales to the largest size that fits the screen.
        Caps at intrinsic pixels (1024×682) so the file is never upscaled (no softening).
      */
      .hero {
        display: block;
        width: auto;
        height: auto;
        max-width: min(100%, 1024px);
        max-height: min(100%, 682px);
        object-fit: contain;
        object-position: center;
        image-rendering: auto;
      }
      @supports (height: 100dvh) {
        .frame {
          height: 100dvh;
          width: 100dvw;
        }
        .hero {
          max-width: min(100%, 1024px, calc(100dvh * 1024 / 682));
          max-height: min(100%, 682px, calc(100dvw * 682 / 1024));
        }
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <img
        class="hero"
        src="/hero.jpg"
        width="1024"
        height="682"
        alt="The Unseated Juror — Real cases. Sharper questions. A deeper look. Coming soon."
        decoding="async"
        fetchpriority="high"
      />
    </main>
  </body>
</html>
